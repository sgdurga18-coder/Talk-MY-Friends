<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status View | Connectly</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:#050712;
    color:white;
    overflow:hidden;
}

/* Main */

.status-screen{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#252b54 0%,#080a16 55%,#03040a 100%);
}

/* Progress */

.progress-container{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:700px;
    display:flex;
    gap:5px;
    z-index:10;
}

.progress{
    height:3px;
    flex:1;
    background:rgba(255,255,255,.3);
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    width:100%;
    height:100%;
    background:white;
}

/* Header */

.header{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:700px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:10;
}

.back-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,.35);
    color:white;
    font-size:23px;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid white;
}

.user-info{
    flex:1;
}

.user-info h3{
    font-size:16px;
    margin-bottom:4px;
}

.user-info p{
    color:#c2c5d5;
    font-size:12px;
}

.menu-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    color:white;
    font-size:22px;
    cursor:pointer;
}

/* Status Content */

.content{
    width:90%;
    max-width:700px;
    min-height:500px;
    max-height:75vh;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.status-image{
    width:100%;
    height:100%;
    max-height:75vh;
    object-fit:cover;
    display:none;
}

.text-status{
    width:100%;
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px;
    background:
        linear-gradient(135deg,#38226b,#101b45,#541f69);
}

.text-status h1{
    font-size:38px;
    line-height:1.3;
}

/* Caption */

.caption{
    position:absolute;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    width:85%;
    max-width:600px;
    padding:15px 20px;
    border-radius:16px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
    text-align:center;
    font-size:15px;
}

/* Bottom */

.bottom{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:700px;
    display:flex;
    align-items:center;
    gap:10px;
}

.reply{
    flex:1;
    height:45px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    background:rgba(255,255,255,.08);
    color:white;
    padding:0 18px;
    outline:none;
}

.reply::placeholder{
    color:#a7abc0;
}

.send-btn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#7357ff,#a34cff);
    color:white;
    font-size:19px;
    cursor:pointer;
}

/* Menu */

.menu{
    display:none;
    position:absolute;
    top:80px;
    right:5%;
    width:190px;
    background:#15192c;
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    overflow:hidden;
    z-index:20;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.menu button{
    width:100%;
    padding:14px 16px;
    text-align:left;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.menu button:hover{
    background:rgba(255,255,255,.08);
}

.menu button.danger{
    color:#ff6b7a;
}

/* Mobile */

@media(max-width:600px){

    .content{
        width:100%;
        height:75vh;
        max-height:none;
        border-radius:0;
        border:none;
    }

    .text-status{
        min-height:75vh;
    }

    .text-status h1{
        font-size:30px;
    }

    .header{
        top:35px;
    }

    .caption{
        bottom:70px;
    }

}

</style>
</head>

<body>

<div class="status-screen">

    <!-- Progress Bar -->

    <div class="progress-container">

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

    </div>


    <!-- Header -->

    <div class="header">

        <button class="back-btn"
                onclick="goBack()">
            ←
        </button>

        <img id="userPhoto"
             class="avatar"
             src="https://i.pravatar.cc/150?img=12">

        <div class="user-info">

            <h3 id="userName">
                Alex Morgan
            </h3>

            <p>
                Just now
            </p>

        </div>

        <button class="menu-btn"
                onclick="toggleMenu()">
            ⋮
        </button>

    </div>


    <!-- Menu -->

    <div class="menu" id="menu">

        <button onclick="muteStatus()">
            🔇 Mute Status
        </button>

        <button onclick="shareStatus()">
            ↗ Share
        </button>

        <button class="danger"
                onclick="reportStatus()">
            ⚠ Report Status
        </button>

    </div>


    <!-- Status -->

    <div class="content">

        <img id="statusImage"
             class="status-image"
             src="">

        <div class="text-status"
             id="textStatus">

            <h1 id="statusText">
                Having a great day! ☀️
            </h1>

        </div>

    </div>


    <!-- Caption -->

    <div class="caption"
         id="caption">

        Having a great day! ☀️

    </div>


    <!-- Reply -->

    <div class="bottom">

        <input
            type="text"
            class="reply"
            id="replyInput"
            placeholder="Reply to status...">

        <button class="send-btn"
                onclick="sendReply()">
            ➤
        </button>

    </div>

</div>


<script>

/* Read URL parameters */

const params =
    new URLSearchParams(window.location.search);

const user =
    params.get("user");

const photo =
    params.get("photo");

const text =
    params.get("text");


/* Load user */

if(user){

    document.getElementById("userName")
        .innerText = user;

}


/* Load photo */

if(photo){

    document.getElementById("userPhoto")
        .src = photo;

}


/* Load status text */

if(text){

    document.getElementById("statusText")
        .innerText = text;

    document.getElementById("caption")
        .innerText = text;

}


/* Back */

function goBack(){

    window.location.href =
        "status.html";

}


/* Menu */

function toggleMenu(){

    const menu =
        document.getElementById("menu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";

    }

}


/* Mute */

function muteStatus(){

    alert("Status muted. (Demo)");

    document.getElementById("menu")
        .style.display = "none";

}


/* Share */

function shareStatus(){

    if(navigator.share){

        navigator.share({
            title:"Connectly Status",
            text:"Check this status on Connectly!"
        });

    }else{

        alert("Share feature will be connected later.");

    }

}


/* Report */

function reportStatus(){

    alert("Status reported. (Demo)");

    document.getElementById("menu")
        .style.display = "none";

}


/* Reply */

function sendReply(){

    const input =
        document.getElementById("replyInput");

    const message =
        input.value.trim();

    if(!message){

        alert("Write a reply first.");

        return;

    }

    alert(
        "Reply sent to " +
        (user || "user") +
        "! (Demo)"
    );

    input.value = "";

}


/* Enter to reply */

document.getElementById("replyInput")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        sendReply();

    }

});


/* Auto progress */

setTimeout(function(){

    goBack();

}, 15000);

</script>

</body>
</html>

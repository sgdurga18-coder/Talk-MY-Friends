<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Popular — Talk My Friends</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow:hidden;
}

/* HEADER */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:65px;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;

    background:linear-gradient(
        rgba(0,0,0,.9),
        rgba(0,0,0,0)
    );
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    background:linear-gradient(
        45deg,
        #ff2d55,
        #8a2be2,
        #00c6ff
    );

    -webkit-background-clip:text;
    color:transparent;
}

.header-right{
    display:flex;
    gap:10px;
}

.header-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.13);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* CATEGORY */

.categories{
    position:fixed;
    top:67px;
    left:50%;
    transform:translateX(-50%);
    z-index:90;

    display:flex;
    gap:10px;

    overflow-x:auto;
    max-width:95%;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    white-space:nowrap;
    border:1px solid #444;
    background:#171717;
    color:#aaa;

    padding:8px 15px;
    border-radius:20px;

    cursor:pointer;
}

.category.active{
    background:#fff;
    color:#000;
}

/* FEED */

.feed{
    width:100%;
    height:100vh;

    overflow-y:auto;

    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

.feed::-webkit-scrollbar{
    display:none;
}

.video-card{
    position:relative;

    width:100%;
    height:100vh;

    scroll-snap-align:start;

    background:#111;
    overflow:hidden;
}

.video{
    width:100%;
    height:100%;

    object-fit:cover;

    background:#111;
}

/* GRADIENT */

.gradient{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.55),
            transparent 28%,
            transparent 55%,
            rgba(0,0,0,.9)
        );
}

/* TRENDING BADGE */

.trending{
    position:absolute;
    top:115px;
    left:15px;

    z-index:10;

    background:rgba(255,45,85,.9);
    padding:7px 12px;

    border-radius:20px;

    font-size:13px;
    font-weight:bold;
}

/* INFO */

.info{
    position:absolute;

    left:15px;
    right:85px;
    bottom:30px;

    z-index:20;
}

.creator{
    display:flex;
    align-items:center;
    gap:9px;

    margin-bottom:12px;
}

.avatar{
    width:43px;
    height:43px;

    border-radius:50%;
    object-fit:cover;

    border:2px solid white;
}

.username{
    font-weight:bold;
}

.follow{
    margin-left:5px;

    padding:5px 10px;

    border:1px solid white;
    background:transparent;

    color:#fff;

    border-radius:8px;

    cursor:pointer;
}

.caption{
    font-size:15px;
    line-height:1.45;

    margin-bottom:8px;
}

.hashtags{
    color:#75cfff;
}

/* ACTIONS */

.actions{
    position:absolute;

    right:12px;
    bottom:30px;

    z-index:30;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:18px;
}

.action{
    text-align:center;
    cursor:pointer;
}

.action-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(0,0,0,.42);

    font-size:25px;
}

.action-count{
    margin-top:3px;
    font-size:12px;
}

.liked .action-icon{
    color:#ff304f;
}

.saved .action-icon{
    color:#ffd400;
}

/* SCORE */

.score{
    position:absolute;

    top:115px;
    right:15px;

    z-index:20;

    font-size:11px;
    color:#ddd;

    background:rgba(0,0,0,.45);

    padding:6px 9px;
    border-radius:15px;
}

/* LOADING */

.loading{
    position:fixed;
    inset:0;

    background:#000;

    z-index:500;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}

.hidden{
    display:none!important;
}

/* EMPTY */

.empty{
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    padding:30px;
}

.empty h2{
    margin-bottom:10px;
}

.empty button{
    margin-top:20px;

    border:0;

    padding:12px 22px;

    border-radius:12px;

    font-weight:bold;

    cursor:pointer;
}

/* HEART */

.big-heart{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1);

    font-size:100px;

    z-index:100;

    transition:.55s;

    pointer-events:none;
}

/* COMMENTS */

.comments{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    max-width:600px;
    margin:auto;

    z-index:400;

    background:#171717;

    border-radius:25px 25px 0 0;

    padding:20px;

    max-height:70vh;
}

.comment-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.close{
    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:#333;
    color:#fff;

    font-size:20px;

    cursor:pointer;
}

.comment-list{
    max-height:42vh;

    overflow:auto;

    margin:15px 0;
}

.comment{
    padding:10px 0;

    border-bottom:1px solid #292929;
}

.comment-box{
    display:flex;
    gap:8px;
}

.comment-box input{
    flex:1;

    background:#222;

    border:1px solid #444;

    color:white;

    padding:12px;

    border-radius:10px;

    outline:none;
}

.comment-box button{
    width:55px;

    border:0;

    border-radius:10px;

    background:white;

    color:black;
}

/* DESKTOP */

@media(min-width:800px){

    .video-card{
        width:480px;
        margin:auto;
    }

    .feed{
        background:#050505;
    }
}
</style>
</head>

<body>

<div class="loading" id="loading">
    Loading Popular Videos...
</div>


<header class="header">

    <div class="logo">
        Talk <span>My Friends</span>
    </div>

    <a href="home.html">Home</a>

    <div class="header-right">

        <button
            class="header-btn"
            onclick="toggleMute()"
            id="muteButton"
        >
            🔊
        </button>

        <button
            class="header-btn"
            onclick="location.reload()"
        >
            ↻
        </button>

    </div>

</header>


<!-- CATEGORIES -->

<div class="categories">

    <div
        class="category active"
        data-filter="trending">
        🔥 Trending
    </div>

    <div
        class="category"
        data-filter="mostLiked">
        ❤️ Most Liked
    </div>

    <div
        class="category"
        data-filter="mostViewed">
        👁️ Most Viewed
    </div>

    <div
        class="category"
        data-filter="mostCommented">
        💬 Most Commented
    </div>

    <div
        class="category"
        data-filter="latest">
        🆕 Latest
    </div>

</div>


<main
    class="feed"
    id="feed">
</main>


<!-- COMMENTS -->

<div
    class="comments hidden"
    id="commentsPanel">

    <div class="comment-header">

        <h3>Comments</h3>

        <button
            class="close"
            onclick="closeComments()">
            ×
        </button>

    </div>

    <div
        class="comment-list"
        id="commentList">
    </div>

    <div class="comment-box">

        <input
            id="commentInput"
            placeholder="Add a comment..."
        >

        <button
            onclick="sendComment()">
            ➤
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    updateDoc,
    doc,
    increment,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* ==========================================
   INITIALIZE
========================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let currentUser = null;

let allVideos = [];

let currentFilter = "trending";

let currentCommentVideo = null;

let muted = true;


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    user => {

        currentUser = user;

        loadPopularVideos();

    }
);


/* ==========================================
   LOAD REAL VIDEOS
========================================== */

async function loadPopularVideos(){

    try{

        const q =
            query(
                collection(db,"videos"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

        const snapshot =
            await getDocs(q);

        allVideos = [];

        snapshot.forEach(
            item => {

                const data =
                    item.data();

                allVideos.push({

                    id:item.id,

                    ...data

                });

            }
        );


        calculateScores();

        showVideos();


    }catch(error){

        console.error(error);

        document
        .getElementById("feed")
        .innerHTML = `

            <div class="empty">

                <h2>
                    Couldn't load videos
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <button
                    onclick="location.reload()">
                    Retry
                </button>

            </div>

        `;

    }


    document
    .getElementById("loading")
    .classList.add("hidden");

}


/* ==========================================
   POPULARITY SCORE
========================================== */

function calculateScores(){

    allVideos.forEach(video => {

        const likes =
            Number(video.likes || 0);

        const comments =
            Number(video.comments || 0);

        const views =
            Number(video.views || 0);

        const shares =
            Number(video.shares || 0);


        /*
          Engagement formula

          Views = basic reach
          Likes = strong engagement
          Comments = stronger engagement
          Shares = very strong engagement
        */

        const engagementScore =

            (views * 1) +

            (likes * 5) +

            (comments * 8) +

            (shares * 12);


        let ageHours = 1;

        if(
            video.createdAt &&
            video.createdAt.toDate
        ){

            ageHours =
                (
                    Date.now() -
                    video.createdAt
                    .toDate()
                    .getTime()
                )
                /
                (1000*60*60);

        }


        ageHours =
            Math.max(
                1,
                ageHours
            );


        /*
          Fresh content gets
          a small boost.
        */

        const freshness =
            100 /
            Math.pow(
                ageHours,
                .35
            );


        video.popularityScore =
            engagementScore +
            freshness;

    });

}


/* ==========================================
   SORT
========================================== */

function getSortedVideos(){

    let videos =
        [...allVideos];


    if(
        currentFilter ===
        "mostLiked"
    ){

        videos.sort(
            (a,b) =>
                Number(b.likes || 0) -
                Number(a.likes || 0)
        );

    }


    else if(
        currentFilter ===
        "mostViewed"
    ){

        videos.sort(
            (a,b) =>
                Number(b.views || 0) -
                Number(a.views || 0)
        );

    }


    else if(
        currentFilter ===
        "mostCommented"
    ){

        videos.sort(
            (a,b) =>
                Number(b.comments || 0) -
                Number(a.comments || 0)
        );

    }


    else if(
        currentFilter ===
        "latest"
    ){

        videos.sort(
            (a,b) => {

                const aTime =
                    a.createdAt?.toMillis?.() ||
                    0;

                const bTime =
                    b.createdAt?.toMillis?.() ||
                    0;

                return bTime-aTime;

            }
        );

    }


    else{

        videos.sort(
            (a,b) =>
                b.popularityScore -
                a.popularityScore
        );

    }


    return videos;

}


/* ==========================================
   SHOW VIDEOS
========================================== */

function showVideos(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";


    const videos =
        getSortedVideos();


    if(videos.length === 0){

        feed.innerHTML = `

            <div class="empty">

                <h2>
                    No popular videos yet
                </h2>

                <p>
                    Upload the first video
                    to Talk My Friends.
                </p>

            </div>

        `;

        return;

    }


    videos.forEach(
        (video,index) => {

            createCard(
                video,
                index
            );

        }
    );


    startObserver();

}


/* ==========================================
   CREATE CARD
========================================== */

function createCard(
    data,
    index
){

    const card =
        document.createElement("section");

    card.className =
        "video-card";


    const avatar =
        data.photoURL ||
        "https://via.placeholder.com/100";


    const username =
        data.username ||
        "User";


    const likes =
        Number(data.likes || 0);


    const comments =
        Number(data.comments || 0);


    const views =
        Number(data.views || 0);


    const shares =
        Number(data.shares || 0);


    card.dataset.id =
        data.id;


    card.innerHTML = `

        <video
            class="video"
            src="${escapeAttribute(
                data.videoUrl || ""
            )}"
            loop
            playsinline
            muted
            preload="metadata">
        </video>


        <div class="gradient"></div>


        ${
            index < 10
            ?
            `<div class="trending">
                🔥 Trending
             </div>`
            :
            ""
        }


        <div class="score">
            Popular #${index+1}
        </div>


        <div class="info">

            <div class="creator">

                <img
                    class="avatar"
                    src="${escapeAttribute(
                        avatar
                    )}"
                >

                <span class="username">
                    @${escapeHTML(
                        username
                    )}
                </span>

                <button
                    class="follow"
                    onclick="
                        followUser(
                            '${escapeAttribute(
                                data.uid || ''
                            )}'
                        )
                    ">
                    Follow
                </button>

            </div>


            <div class="caption">
                ${escapeHTML(
                    data.caption || ""
                )}
            </div>


            <div class="hashtags">
                ${escapeHTML(
                    data.hashtags || ""
                )}
            </div>

        </div>


        <div class="actions">


            <div
                class="action like"
                onclick="
                    likeVideo(
                        '${data.id}',
                        this
                    )
                ">

                <div class="action-icon">
                    ❤️
                </div>

                <div class="action-count">
                    ${likes}
                </div>

            </div>


            <div
                class="action"
                onclick="
                    openComments(
                        '${data.id}'
                    )
                ">

                <div class="action-icon">
                    💬
                </div>

                <div class="action-count">
                    ${comments}
                </div>

            </div>


            <div
                class="action"
                onclick="
                    shareVideo(
                        '${escapeAttribute(
                            data.videoUrl || ''
                        )}',
                        '${data.id}'
                    )
                ">

                <div class="action-icon">
                    ↗️
                </div>

                <div class="action-count">
                    ${shares}
                </div>

            </div>


            <div
                class="action save"
                onclick="
                    saveVideo(
                        '${data.id}',
                        this
                    )
                ">

                <div class="action-icon">
                    🔖
                </div>

                <div class="action-count">
                    Save
                </div>

            </div>


            <div
                class="action"
                onclick="
                    muteThisVideo(this)
                ">

                <div class="action-icon">
                    🔊
                </div>

                <div class="action-count">
                    Sound
                </div>

            </div>

        </div>

    `;


    /* DOUBLE TAP LIKE */

    let lastTap = 0;


    card
    .querySelector(".video")
    .addEventListener(
        "touchend",
        () => {

            const now =
                Date.now();


            if(
                now-lastTap < 350
            ){

                const button =
                    card.querySelector(
                        ".like"
                    );


                likeVideo(
                    data.id,
                    button
                );


                showHeart(card);

            }


            lastTap = now;

        }
    );


    feed.appendChild(card);

}


/* ==========================================
   AUTO PLAY
========================================== */

function startObserver(){

    const observer =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        const video =
                            entry.target
                            .querySelector(
                                ".video"
                            );


                        if(
                            entry.isIntersecting
                        ){

                            video.muted =
                                muted;

                            video
                            .play()
                            .catch(
                                ()=>{}
                            );


                            registerView(
                                entry
                                .target
                                .dataset
                                .id
                            );

                        }

                        else{

                            video.pause();

                        }

                    }
                );

            },

            {
                threshold:.75
            }

        );


    document
    .querySelectorAll(".video-card")
    .forEach(card =>
        observer.observe(card)
    );

}


/* ==========================================
   VIEW COUNT
========================================== */

async function registerView(id){

    try{

        await updateDoc(

            doc(
                db,
                "videos",
                id
            ),

            {
                views:
                    increment(1)
            }

        );

    }catch(error){

        console.log(
            "View update:",
            error
        );

    }

}


/* ==========================================
   LIKE
========================================== */

window.likeVideo =
async function(
    id,
    button
){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "videos",
                id
            ),

            {
                likes:
                    increment(1)
            }

        );


        button.classList.add(
            "liked"
        );


        const count =
            button.querySelector(
                ".action-count"
            );


        count.innerText =
            Number(
                count.innerText
            )+1;


    }catch(error){

        console.error(error);

    }

};


/* ==========================================
   SHARE
========================================== */

window.shareVideo =
async function(
    url,
    id
){

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Talk My Friends",

                text:
                    "Check this video!",

                url:url

            });

        }

        else{

            await navigator
                .clipboard
                .writeText(url);

            alert(
                "Video link copied!"
            );

        }


        /* REAL SHARE COUNT */

        try{

            await updateDoc(

                doc(
                    db,
                    "videos",
                    id
                ),

                {
                    shares:
                        increment(1)
                }

            );

        }catch(e){

            console.log(e);

        }


    }catch(error){

        console.log(error);

    }

};


/* ==========================================
   SAVE
========================================== */

window.saveVideo =
function(
    id,
    button
){

    button.classList.toggle(
        "saved"
    );

};


/* ==========================================
   FOLLOW
========================================== */

window.followUser =
async function(uid){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    if(
        !uid ||
        uid === currentUser.uid
    ){

        return;

    }


    try{

        await addDoc(

            collection(
                db,
                "follows"
            ),

            {

                followerId:
                    currentUser.uid,

                followingId:
                    uid,

                createdAt:
                    serverTimestamp()

            }

        );


        alert(
            "Following!"
        );


    }catch(error){

        console.error(error);

    }

};


/* ==========================================
   COMMENTS
========================================== */

window.openComments =
async function(id){

    currentCommentVideo =
        id;


    document
    .getElementById(
        "commentsPanel"
    )
    .classList.remove(
        "hidden"
    );


    await loadComments(id);

};


window.closeComments =
function(){

    document
    .getElementById(
        "commentsPanel"
    )
    .classList.add(
        "hidden"
    );

};


async function loadComments(id){

    const list =
        document.getElementById(
            "commentList"
        );


    list.innerHTML =
        "Loading comments...";


    try{

        const q =
            query(

                collection(
                    db,
                    "videos",
                    id,
                    "comments"
                ),

                orderBy(
                    "createdAt",
                    "asc"
                )

            );


        const snapshot =
            await getDocs(q);


        list.innerHTML = "";


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const div =
                    document
                    .createElement(
                        "div"
                    );


                div.className =
                    "comment";


                div.innerHTML = `

                    <b>
                        @${escapeHTML(
                            data.username ||
                            "User"
                        )}
                    </b>

                    <br>

                    ${escapeHTML(
                        data.text || ""
                    )}

                `;


                list.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            "No comments yet.";

    }

}


/* ==========================================
   SEND COMMENT
========================================== */

window.sendComment =
async function(){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const input =
        document.getElementById(
            "commentInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    try{

        await addDoc(

            collection(
                db,
                "videos",
                currentCommentVideo,
                "comments"
            ),

            {

                uid:
                    currentUser.uid,

                username:
                    currentUser.displayName ||
                    "User",

                text:text,

                createdAt:
                    serverTimestamp()

            }

        );


        await updateDoc(

            doc(
                db,
                "videos",
                currentCommentVideo
            ),

            {

                comments:
                    increment(1)

            }

        );


        input.value = "";


        await loadComments(
            currentCommentVideo
        );


    }catch(error){

        alert(
            error.message
        );

    }

};


/* ==========================================
   MUTE
========================================== */

window.toggleMute =
function(){

    muted =
        !muted;


    document
    .querySelectorAll(
        ".video"
    )
    .forEach(video => {

        video.muted =
            muted;

    });


    document
    .getElementById(
        "muteButton"
    )
    .innerText =
        muted
        ? "🔇"
        : "🔊";

};


window.muteThisVideo =
function(button){

    const card =
        button.closest(
            ".video-card"
        );


    const video =
        card.querySelector(
            ".video"
        );


    video.muted =
        !video.muted;


    button.querySelector(
        ".action-icon"
    ).innerText =
        video.muted
        ? "🔇"
        : "🔊";

};


/* ==========================================
   HEART
========================================== */

function showHeart(card){

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "big-heart";


    heart.innerText =
        "❤️";


    card.appendChild(
        heart
    );


    setTimeout(
        () => {

            heart.style.transform =
                "translate(-50%,-50%) scale(1.7)";

            heart.style.opacity =
                "0";

        },
        50
    );


    setTimeout(
        () => {

            heart.remove();

        },
        600
    );

}


/* ==========================================
   CATEGORY FILTER
========================================== */

document
.querySelectorAll(
    ".category"
)
.forEach(category => {

    category.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".category"
            )
            .forEach(
                x =>
                    x.classList
                    .remove(
                        "active"
                    )
            );


            category.classList.add(
                "active"
            );


            currentFilter =
                category.dataset.filter;


            showVideos();

        }
    );

});


/* ==========================================
   SECURITY
========================================== */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(text){

    return String(text)
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

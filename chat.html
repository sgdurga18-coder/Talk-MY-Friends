<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Talk MY Friends</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b18;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .chat-app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      margin: auto;
      background: #0c1224;
    }

    /* Header */
    .chat-header {
      height: 70px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(16, 24, 45, 0.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .back-btn {
      border: none;
      background: transparent;
      color: white;
      font-size: 27px;
      cursor: pointer;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, #5b5cff, #a855f7);
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-info h3 {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-info p {
      font-size: 12px;
      color: #9ca8c7;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(139,92,246,.25);
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .empty-chat {
      margin: auto;
      text-align: center;
      color: #8d98b4;
    }

    .empty-chat .big {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message {
      max-width: min(75%, 550px);
      padding: 10px 13px;
      border-radius: 17px;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .mine .message {
      background: linear-gradient(135deg, #5b5cff, #8b5cf6);
      border-bottom-right-radius: 5px;
    }

    .theirs .message {
      background: #18213a;
      border-bottom-left-radius: 5px;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.4;
    }

    .message-time {
      font-size: 10px;
      opacity: .65;
      margin-top: 5px;
      text-align: right;
    }

    /* Composer */
    .composer {
      padding: 12px;
      background: #0e162b;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .composer-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #151f37;
      border-radius: 25px;
      padding: 5px 7px 5px 14px;
    }

    .attach-btn {
      border: none;
      background: transparent;
      color: #aab5d0;
      font-size: 21px;
      cursor: pointer;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      min-width: 0;
      padding: 10px 4px;
    }

    #messageInput::placeholder {
      color: #76819c;
    }

    #sendBtn {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(135deg, #5b5cff, #a855f7);
      color: white;
      font-size: 18px;
    }

    #sendBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status-message {
      text-align: center;
      font-size: 12px;
      color: #8994af;
      padding: 4px;
      display: none;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .chat-header {
        height: 64px;
        padding: 8px 10px;
      }

      .messages {
        padding: 14px 10px;
      }

      .message {
        max-width: 82%;
      }

      .header-actions {
        gap: 3px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>

<div class="chat-app">

  <!-- HEADER -->
  <header class="chat-header">

    <button class="back-btn" onclick="goBack()">‹</button>

    <img
      id="userPhoto"
      class="avatar"
      src="https://via.placeholder.com/100"
      alt="Profile"
    >

    <div class="user-info">
      <h3 id="userName">Loading...</h3>
      <p id="userStatus">Talk MY Friends</p>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="startVoiceCall()">☎</button>
      <button class="icon-btn" onclick="startVideoCall()">▣</button>
    </div>

  </header>

  <!-- MESSAGES -->
  <main id="messages" class="messages">

    <div id="emptyChat" class="empty-chat">
      <div class="big">💬</div>
      <p>Start a conversation</p>
    </div>

  </main>

  <div id="statusMessage" class="status-message"></div>

  <!-- COMPOSER -->
  <div class="composer">

    <div class="composer-inner">

      <button class="attach-btn" onclick="showAttachmentMessage()">＋</button>

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendBtn" onclick="sendMessage()">➤</button>

    </div>

  </div>

</div>


<script type="module">

  import {
    auth,
    db
  } from "./firebase-config.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    collection,
    doc,
    getDoc,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================
     GLOBAL VARIABLES
  ========================= */

  let currentUser = null;
  let otherUser = null;
  let unsubscribeMessages = null;

  const urlParams = new URLSearchParams(window.location.search);

  /*
    New system:

    chat.html?uid=OTHER_USER_UID

    Example:
    chat.html?uid=xxxxxxxx
  */

  const otherUserId = urlParams.get("uid");


  /* =========================
     ELEMENTS
  ========================= */

  const messagesBox = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  const userName = document.getElementById("userName");
  const userPhoto = document.getElementById("userPhoto");
  const userStatus = document.getElementById("userStatus");

  const emptyChat = document.getElementById("emptyChat");


  /* =========================
     AUTH CHECK
  ========================= */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = user;

    if (!otherUserId) {

      userName.textContent = "No user selected";
      userStatus.textContent = "Open a chat from Find People";

      messageInput.disabled = true;
      sendBtn.disabled = true;

      return;
    }

    if (otherUserId === currentUser.uid) {

      userName.textContent = "You";
      userStatus.textContent = "You cannot chat with yourself";

      messageInput.disabled = true;
      sendBtn.disabled = true;

      return;
    }

    await loadOtherUser();
    startRealtimeMessages();

  });


  /* =========================
     LOAD OTHER USER
  ========================= */

  async function loadOtherUser() {

    try {

      const userRef = doc(db, "users", otherUserId);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {

        userName.textContent = "User not found";
        userStatus.textContent = "This account does not exist";

        messageInput.disabled = true;
        sendBtn.disabled = true;

        return;
      }

      otherUser = {
        uid: otherUserId,
        ...userSnap.data()
      };

      userName.textContent =
        otherUser.fullName ||
        otherUser.username ||
        "Talk MY Friends User";

      userStatus.textContent =
        otherUser.username
          ? "@" + otherUser.username
          : "Talk MY Friends";

      if (otherUser.photoURL) {
        userPhoto.src = otherUser.photoURL;
      }

    } catch (error) {

      console.error(error);

      userName.textContent = "Unable to load user";
      userStatus.textContent = "Please try again";

    }

  }


  /* =========================
     CONVERSATION ID
  ========================= */

  function getConversationId(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");

  }


  /* =========================
     REAL-TIME MESSAGES
  ========================= */

  function startRealtimeMessages() {

    const conversationId =
      getConversationId(
        currentUser.uid,
        otherUserId
      );

    const messagesRef = collection(
      db,
      "chats",
      conversationId,
      "messages"
    );

    const messagesQuery = query(
      messagesRef,
      orderBy("createdAt", "asc")
    );

    unsubscribeMessages = onSnapshot(
      messagesQuery,
      (snapshot) => {

        messagesBox.innerHTML = "";

        if (snapshot.empty) {

          messagesBox.appendChild(emptyChat);

          return;
        }

        snapshot.forEach((messageDoc) => {

          const message = {
            id: messageDoc.id,
            ...messageDoc.data()
          };

          renderMessage(message);

        });

        scrollToBottom();

      },
      (error) => {

        console.error("Message listener error:", error);

        showStatus(
          "Unable to load messages. Check Firestore rules."
        );

      }
    );

  }


  /* =========================
     RENDER MESSAGE
  ========================= */

  function renderMessage(message) {

    const row = document.createElement("div");

    const mine =
      message.senderId === currentUser.uid;

    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");


    const bubble = document.createElement("div");

    bubble.className = "message";


    const text = document.createElement("div");

    text.className = "message-text";

    text.textContent =
      message.text || "";


    const time = document.createElement("div");

    time.className = "message-time";

    time.textContent =
      formatTime(message.createdAt);


    bubble.appendChild(text);
    bubble.appendChild(time);

    row.appendChild(bubble);

    messagesBox.appendChild(row);

  }


  /* =========================
     SEND MESSAGE
  ========================= */

  window.sendMessage = async function () {

    const text =
      messageInput.value.trim();

    if (!text) return;

    if (!currentUser || !otherUserId) return;

    sendBtn.disabled = true;

    try {

      const conversationId =
        getConversationId(
          currentUser.uid,
          otherUserId
        );

      const messagesRef = collection(
        db,
        "chats",
        conversationId,
        "messages"
      );

      await addDoc(messagesRef, {

        senderId: currentUser.uid,

        receiverId: otherUserId,

        text: text,

        type: "text",

        createdAt: serverTimestamp(),

        read: false,

        delivered: false

      });

      messageInput.value = "";

      messageInput.focus();

    } catch (error) {

      console.error("Send message error:", error);

      showStatus(
        "Message send failed. Please check Firebase."
      );

    }

    sendBtn.disabled = false;

  };


  /* =========================
     ENTER TO SEND
  ========================= */

  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================
     TIME FORMAT
  ========================= */

  function formatTime(timestamp) {

    if (!timestamp) {
      return "Sending...";
    }

    try {

      const date =
        timestamp.toDate();

      return date.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch {

      return "";

    }

  }


  /* =========================
     SCROLL
  ========================= */

  function scrollToBottom() {

    setTimeout(() => {

      messagesBox.scrollTop =
        messagesBox.scrollHeight;

    }, 50);

  }


  /* =========================
     BACK
  ========================= */

  window.goBack = function () {

    if (document.referrer) {

      history.back();

    } else {

      window.location.href =
        "home.html";

    }

  };


  /* =========================
     CALL BUTTONS
  ========================= */

  window.startVoiceCall = function () {

    if (!otherUserId) return;

    window.location.href =
      "call.html?type=voice&uid=" +
      encodeURIComponent(otherUserId);

  };


  window.startVideoCall = function () {

    if (!otherUserId) return;

    window.location.href =
      "call.html?type=video&uid=" +
      encodeURIComponent(otherUserId);

  };


  /* =========================
     ATTACHMENT
  ========================= */

  window.showAttachmentMessage = function () {

    showStatus(
      "Photo, video and file sharing will be connected next."
    );

  };


  function showStatus(text) {

    const status =
      document.getElementById(
        "statusMessage"
      );

    status.textContent = text;
    status.style.display = "block";

    setTimeout(() => {

      status.style.display = "none";

    }, 3000);

  }


  /* =========================
     CLEANUP
  ========================= */

  window.addEventListener(
    "beforeunload",
    () => {

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

    }
  );

</script>

</body>
</html>

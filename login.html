<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Talk MY Friends</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #263b8f, transparent 35%),
        radial-gradient(circle at bottom right, #671c91, transparent 35%),
        #07111f;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 450px;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.15);

      border-radius: 25px;

      padding: 35px;

      backdrop-filter: blur(20px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;

      font-size: 29px;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .logo span {
      color: #a855f7;
    }

    .subtitle {
      text-align: center;

      color: #aeb8cc;

      margin-bottom: 28px;
    }

    h1 {
      text-align: center;

      font-size: 27px;

      margin-bottom: 8px;
    }

    label {
      display: block;

      margin-top: 17px;

      margin-bottom: 7px;

      font-size: 14px;

      color: #dce3f5;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;

      padding: 14px 45px 14px 15px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.15);

      outline: none;

      background: rgba(0,0,0,0.22);

      color: white;

      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    .show-password {
      position: absolute;

      right: 14px;

      top: 50%;

      transform: translateY(-50%);

      cursor: pointer;

      color: #aeb8cc;

      font-size: 14px;
    }

    .options {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin: 18px 0 22px;

      font-size: 13px;
    }

    .remember {
      display: flex;

      align-items: center;

      gap: 7px;

      color: #b8c0d4;
    }

    .remember input {
      accent-color: #8b5cf6;
    }

    .forgot {
      color: #a855f7;

      text-decoration: none;
    }

    .login-btn {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(135deg, #6366f1, #a855f7);

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: rgba(239,68,68,0.15);

      color: #fca5a5;

      border: 1px solid rgba(239,68,68,0.2);
    }

    .message.success {
      display: block;

      background: rgba(34,197,94,0.15);

      color: #86efac;

      border: 1px solid rgba(34,197,94,0.2);
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin: 25px 0;

      color: #76829b;

      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      flex: 1;

      background: rgba(255,255,255,0.12);
    }

    .demo-info {
      padding: 12px;

      border-radius: 10px;

      background: rgba(59,130,246,0.08);

      color: #a9c7ff;

      font-size: 12px;

      text-align: center;

      margin-bottom: 18px;

      line-height: 1.5;
    }

    .signup {
      text-align: center;

      margin-top: 23px;

      color: #aeb8cc;

      font-size: 14px;
    }

    .signup a {
      color: #a855f7;

      text-decoration: none;

      font-weight: bold;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #8994aa;

      text-decoration: none;

      font-size: 14px;
    }

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .login-box {
        padding: 28px 20px;

        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .logo {
        font-size: 26px;
      }

    }
  </style>
</head>


<body>

  <div class="login-box">

    <div class="logo">
      Talk MY <span>Friends</span>
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue to Talk MY Friends
    </p>


    <form id="loginForm">

      <!-- Email -->

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >


      <!-- Password -->

      <label for="password">
        Password
      </label>

      <div class="input-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <span
          class="show-password"
          id="showPassword"
        >
          Show
        </span>

      </div>


      <!-- Options -->

      <div class="options">

        <label class="remember">

          <input
            type="checkbox"
            id="rememberMe"
          >

          Remember me

        </label>


        <a
          href="forgot-password.html"
          class="forgot"
        >
          Forgot password?
        </a>

      </div>


      <!-- Login -->

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>


      <!-- Message -->

      <div
        class="message"
        id="message"
      ></div>

    </form>


    <div class="divider">
      OR
    </div>


    <div class="demo-info">

      🔐 Your account is protected by
      Firebase Authentication.

      <br>

      Use the email and password you used
      when creating your account.

    </div>


    <div class="signup">

      Don't have an account?

      <a href="signup.html">
        Create Account
      </a>

    </div>


    <a
      href="index.html"
      class="back"
    >
      ← Back to Home
    </a>

  </div>



  <!-- =====================================
       FIREBASE LOGIN
  ====================================== -->

  <script type="module">

    /*
      Import Firebase Authentication
      from our firebase-config.js file.
    */

    import { auth } from "./firebase-config.js";


    import {
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /*
      Get HTML elements
    */

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberMe =
      document.getElementById("rememberMe");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    /*
      Show / Hide Password
    */

    showPassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        showPassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";

        showPassword.textContent = "Show";

      }

    });


    /*
      Show message
    */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /*
      Firebase Login
    */

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      /*
        Disable button
      */

      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      try {

        /*
          Remember Me

          Checked:
          Stay logged in.

          Not checked:
          Session can end when browser session ends.
        */

        if (rememberMe.checked) {

          await setPersistence(
            auth,
            browserLocalPersistence
          );

        } else {

          await setPersistence(
            auth,
            browserSessionPersistence
          );

        }


        /*
          Firebase Authentication
        */

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        /*
          Check email verification
        */

        if (!user.emailVerified) {

          showMessage(
            "Your email is not verified yet. " +
            "Please check your email and click the verification link.",
            "error"
          );


          /*
            Give option to resend verification email
          */

          const resend =
            document.createElement("button");

          resend.type = "button";

          resend.textContent =
            "Resend Verification Email";

          resend.style.marginTop = "12px";

          resend.style.width = "100%";

          resend.style.padding = "11px";

          resend.style.border = "none";

          resend.style.borderRadius = "10px";

          resend.style.background =
            "rgba(168,85,247,0.18)";

          resend.style.color = "#d8b4fe";

          resend.style.cursor = "pointer";


          message.appendChild(
            document.createElement("br")
          );

          message.appendChild(resend);


          resend.addEventListener(
            "click",
            async () => {

              try {

                await sendEmailVerification(user);

                showMessage(
                  "Verification email sent again. " +
                  "Please check your inbox.",
                  "success"
                );

              } catch (error) {

                showMessage(
                  "Could not send verification email. " +
                  "Please try again later.",
                  "error"
                );

              }

            }
          );


          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

          return;
        }


        /*
          Login successful
        */

        showMessage(
          "Login successful! Welcome to Talk MY Friends.",
          "success"
        );


        loginBtn.textContent =
          "Login Successful";


        /*
          Store login information
          locally for the frontend.
        */

        localStorage.setItem(
          "talkMyFriendsLoggedIn",
          "true"
        );


        localStorage.setItem(
          "talkMyFriendsUser",
          JSON.stringify({
            uid: user.uid,
            email: user.email
          })
        );


        /*
          Go to Home
        */

        setTimeout(() => {

          window.location.href =
            "home.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let errorMessage =
          "Something went wrong. Please try again.";


        /*
          Firebase error handling
        */

        switch (error.code) {

          case "auth/invalid-credential":

            errorMessage =
              "Incorrect email or password.";

            break;


          case "auth/invalid-login-credentials":

            errorMessage =
              "Incorrect email or password.";

            break;


          case "auth/user-not-found":

            errorMessage =
              "No account found with this email.";

            break;


          case "auth/wrong-password":

            errorMessage =
              "Incorrect password.";

            break;


          case "auth/invalid-email":

            errorMessage =
              "Please enter a valid email address.";

            break;


          case "auth/user-disabled":

            errorMessage =
              "This account has been disabled.";

            break;


          case "auth/too-many-requests":

            errorMessage =
              "Too many login attempts. Please try again later.";

            break;


          case "auth/network-request-failed":

            errorMessage =
              "Network error. Check your internet connection.";

            break;


          case "auth/operation-not-allowed":

            errorMessage =
              "Email/Password login is not enabled in Firebase.";

            break;

        }


        showMessage(
          errorMessage,
          "error"
        );


        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }

    });

  </script>

</body>
</html>

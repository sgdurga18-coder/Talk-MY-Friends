<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Connectly</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;

    background:
        radial-gradient(circle at 15% 20%, #243b75 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #4b236d 0%, transparent 35%),
        #080b18;
}

/* HOME */

.home{
    position:fixed;
    top:25px;
    left:30px;

    color:#aeb3d0;
    text-decoration:none;
    font-size:14px;

    padding:10px 15px;
    border-radius:12px;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

.home:hover{
    color:white;
    background:rgba(255,255,255,.1);
}


/* CONTAINER */

.container{
    width:100%;
    max-width:450px;
    padding:20px;
}


/* CARD */

.card{
    padding:38px 35px;

    border-radius:28px;

    background:rgba(18,22,48,.8);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(22px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);
}


/* LOGO */

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo-icon{
    width:58px;
    height:58px;

    margin:0 auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            #8c6cff,
            #4fc3ff
        );

    font-size:26px;

    box-shadow:
        0 12px 30px rgba(100,120,255,.3);
}

.logo h1{
    font-size:25px;
}

.logo h1 span{
    color:#8f7aff;
}

.logo p{
    color:#858aa6;
    font-size:13px;
    margin-top:6px;
}


/* ICON */

.reset-icon{
    width:72px;
    height:72px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    background:rgba(140,108,255,.1);

    border:1px solid rgba(140,108,255,.2);

    font-size:32px;
}


/* HEADING */

.heading{
    text-align:center;
    margin-bottom:25px;
}

.heading h2{
    font-size:25px;
    margin-bottom:9px;
}

.heading p{
    color:#858aa6;
    font-size:13px;
    line-height:1.6;
}


/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    color:#c6c9dc;

    font-size:13px;

    margin-bottom:8px;
}

.input{
    width:100%;
    height:50px;

    padding:0 15px;

    color:white;

    font-size:14px;

    outline:none;

    border-radius:13px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.1);

    transition:.3s;
}

.input:focus{
    border-color:#8170ff;

    box-shadow:
        0 0 0 3px rgba(129,112,255,.1);
}

.input::placeholder{
    color:#666b87;
}


/* BUTTON */

.reset-btn{
    width:100%;
    height:51px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #8c6cff,
            #536cff
        );

    box-shadow:
        0 12px 30px rgba(94,93,255,.25);

    transition:.3s;
}

.reset-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 17px 35px rgba(94,93,255,.38);
}


/* MESSAGE */

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:11px;

    text-align:center;

    font-size:12px;

    line-height:1.5;
}


/* BACK LOGIN */

.back-login{
    text-align:center;

    margin-top:25px;

    color:#7f849f;

    font-size:13px;
}

.back-login a{
    color:#9a86ff;

    text-decoration:none;

    font-weight:bold;
}

.back-login a:hover{
    text-decoration:underline;
}


/* MOBILE */

@media(max-width:500px){

    .home{
        top:15px;
        left:15px;
    }

    .container{
        padding:15px;
    }

    .card{
        padding:30px 22px;
    }

    .heading h2{
        font-size:22px;
    }
}
</style>
</head>


<body>


<!-- HOME -->

<a href="index.html" class="home">
    ← Home
</a>


<div class="container">

    <div class="card">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                💬
            </div>

            <h1>
                Connect<span>ly</span>
            </h1>

            <p>
                Connect. Chat. Share.
            </p>

        </div>


        <!-- RESET ICON -->

        <div class="reset-icon">
            🔐
        </div>


        <!-- HEADING -->

        <div class="heading">

            <h2>
                Forgot your password?
            </h2>

            <p>
                Don't worry. Enter the email address
                connected to your account and we'll
                help you reset your password.
            </p>

        </div>


        <!-- FORM -->

        <form id="resetForm">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="input"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                Send Reset Code →
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </form>


        <!-- BACK LOGIN -->

        <div class="back-login">

            Remember your password?

            <a href="login.html">
                Back to Login
            </a>

        </div>


    </div>

</div>


<script>

document
.getElementById("resetForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const message =
        document.getElementById("message");


    if(email === ""){

        message.style.display = "block";

        message.style.background =
            "rgba(255,80,100,.08)";

        message.style.border =
            "1px solid rgba(255,80,100,.15)";

        message.style.color =
            "#ff9ba8";

        message.innerText =
            "Please enter your email address.";

        return;
    }


    /*
        TEMPORARY FRONTEND DEMO

        Later this button will connect to:

        Backend
        ↓
        Database
        ↓
        Check account
        ↓
        Generate OTP / Reset Code
        ↓
        Send email
        ↓
        verify.html
        ↓
        New Password
    */


    message.style.display = "block";

    message.style.background =
        "rgba(70,220,150,.08)";

    message.style.border =
        "1px solid rgba(70,220,150,.15)";

    message.style.color =
        "#79e6ae";

    message.innerText =
        "If an account exists with this email, a reset code will be sent.";

});

</script>

</body>
</html>

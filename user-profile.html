<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User Profile - Connectly</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at top left, #382080 0%, transparent 35%),
        radial-gradient(circle at bottom right, #152f72 0%, transparent 35%),
        #080b18;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 25px;
    }

    /* Header */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .left-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-btn,
    .menu-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .back-btn:hover,
    .menu-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #9b6cff;
    }

    /* Profile Card */

    .profile-card {
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      padding: 35px;
      backdrop-filter: blur(18px);
    }

    .profile-top {
      text-align: center;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* Avatar */

    .avatar-area {
      position: relative;
      display: inline-block;
      margin-bottom: 18px;
    }

    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7652ff, #b44cff);
      font-size: 40px;
      font-weight: 800;
      border: 4px solid rgba(255,255,255,0.12);
    }

    .online-dot {
      position: absolute;
      right: 7px;
      bottom: 8px;
      width: 21px;
      height: 21px;
      background: #28d17c;
      border-radius: 50%;
      border: 4px solid #101426;
    }

    .profile-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .username {
      color: #9b9fb4;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #6ee7a4;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .bio {
      max-width: 500px;
      margin: auto;
      color: #b4b8c8;
      line-height: 1.6;
      font-size: 14px;
    }

    /* Actions */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 25px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .action-btn {
      padding: 13px 10px;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 700;
      border: none;
      color: white;
    }

    .chat-btn {
      background: linear-gradient(135deg, #7652ff, #a554ff);
    }

    .call-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .action-btn:hover {
      opacity: 0.85;
    }

    /* Info */

    .section {
      padding-top: 25px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.045);
    }

    .info-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: rgba(120,80,255,0.15);
      font-size: 17px;
    }

    .info-content {
      flex: 1;
    }

    .info-label {
      font-size: 11px;
      color: #858ba0;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      color: #e5e7ef;
    }

    /* Block */

    .danger-section {
      margin-top: 25px;
    }

    .block-btn {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid rgba(255,80,100,0.2);
      background: rgba(255,70,90,0.08);
      color: #ff7c8c;
      cursor: pointer;
      font-weight: 700;
    }

    .block-btn:hover {
      background: rgba(255,70,90,0.15);
    }

    /* Menu */

    .menu {
      display: none;
      position: absolute;
      right: 25px;
      top: 80px;
      width: 190px;
      padding: 8px;
      border-radius: 15px;
      background: #151a30;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 20;
    }

    .menu button {
      width: 100%;
      text-align: left;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.08);
    }

    .menu .report {
      color: #ff8c9a;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .profile-card {
        padding: 22px;
      }

      .logo {
        font-size: 21px;
      }

      .avatar {
        width: 110px;
        height: 110px;
        font-size: 34px;
      }

      .profile-name {
        font-size: 24px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .menu {
        right: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->

    <div class="header">

      <div class="left-header">

        <button class="back-btn" onclick="goBack()">
          ←
        </button>

        <div class="logo">
          Connect<span>ly</span>
        </div>

      </div>

      <button class="menu-btn" onclick="toggleMenu()">
        ⋮
      </button>

    </div>


    <!-- More Menu -->

    <div class="menu" id="moreMenu">

      <button onclick="shareProfile()">
        🔗 Share Profile
      </button>

      <button onclick="muteUser()">
        🔕 Mute
      </button>

      <button class="report" onclick="reportUser()">
        🚩 Report User
      </button>

    </div>


    <!-- Profile -->

    <div class="profile-card">

      <div class="profile-top">

        <div class="avatar-area">

          <div class="avatar" id="avatar">
            AM
          </div>

          <div class="online-dot" id="onlineDot"></div>

        </div>


        <div class="profile-name" id="profileName">
          Alex Morgan
        </div>


        <div class="username" id="profileUsername">
          @alexmorgan
        </div>


        <div class="status" id="profileStatus">
          🟢 Online
        </div>


        <div class="bio" id="profileBio">
          Love photography, travel and technology.
        </div>

      </div>


      <!-- Actions -->

      <div class="actions">

        <button
          class="action-btn chat-btn"
          onclick="startChat()">
          💬 Message
        </button>

        <button
          class="action-btn call-btn"
          onclick="voiceCall()">
          📞 Voice
        </button>

        <button
          class="action-btn video-btn"
          onclick="videoCall()">
          📹 Video
        </button>

      </div>


      <!-- About -->

      <div class="section">

        <div class="section-title">
          About
        </div>

        <div class="info-list">


          <div class="info-item">

            <div class="info-icon">
              👤
            </div>

            <div class="info-content">

              <div class="info-label">
                USERNAME
              </div>

              <div
                class="info-value"
                id="infoUsername">
                @alexmorgan
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              🌍
            </div>

            <div class="info-content">

              <div class="info-label">
                CONNECTLY
              </div>

              <div class="info-value">
                Connectly user
              </div>

            </div>

          </div>


          <div class="info-item">

            <div class="info-icon">
              🟢
            </div>

            <div class="info-content">

              <div class="info-label">
                STATUS
              </div>

              <div
                class="info-value"
                id="infoStatus">
                Online
              </div>

            </div>

          </div>

        </div>

      </div>


      <!-- Danger -->

      <div class="danger-section">

        <button
          class="block-btn"
          onclick="blockUser()">
          🚫 Block User
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
      FRONTEND DEMO

      URL example:

      user-profile.html?user=Alex%20Morgan

      Real version:

      User ID
          ↓
      Backend API
          ↓
      Database
          ↓
      Real user profile
    */


    const users = {

      "Alex Morgan": {
        username: "@alexmorgan",
        bio: "Love photography, travel and technology.",
        status: "Online",
        initials: "AM",
        online: true
      },

      "Sarah Wilson": {
        username: "@sarahwilson",
        bio: "Designer • Coffee lover • Creative mind ☕",
        status: "Online",
        initials: "SW",
        online: true
      },

      "Daniel Lee": {
        username: "@daniellee",
        bio: "Software developer building something awesome.",
        status: "Offline",
        initials: "DL",
        online: false
      },

      "Emma Brown": {
        username: "@emmabrown",
        bio: "Music, books and good conversations 🎵",
        status: "Online",
        initials: "EB",
        online: true
      },

      "Ryan Cooper": {
        username: "@ryancooper",
        bio: "Traveler 🌍 | Fitness | Adventure",
        status: "Offline",
        initials: "RC",
        online: false
      },

      "Olivia Smith": {
        username: "@oliviasmith",
        bio: "Digital creator & coffee enthusiast.",
        status: "Online",
        initials: "OS",
        online: true
      },

      "Noah Williams": {
        username: "@noahw",
        bio: "Learning, building and exploring the world.",
        status: "Offline",
        initials: "NW",
        online: false
      },

      "Mia Johnson": {
        username: "@mia_j",
        bio: "Smile more. Travel more. Live more. ✨",
        status: "Online",
        initials: "MJ",
        online: true
      }

    };


    // Load user from URL

    function loadUser() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const userName =
        params.get("user");

      if (!userName) {
        return;
      }


      const user =
        users[userName];

      if (!user) {
        return;
      }


      document.getElementById("profileName")
        .textContent = userName;

      document.getElementById("profileUsername")
        .textContent = user.username;

      document.getElementById("infoUsername")
        .textContent = user.username;

      document.getElementById("profileBio")
        .textContent = user.bio;

      document.getElementById("profileStatus")
        .textContent =
        user.online
          ? "🟢 Online"
          : "⚪ Offline";

      document.getElementById("infoStatus")
        .textContent = user.status;

      document.getElementById("avatar")
        .textContent = user.initials;


      const dot =
        document.getElementById("onlineDot");

      if (user.online) {

        dot.style.display = "block";

      } else {

        dot.style.display = "none";

      }


      document.title =
        userName + " - Connectly";

    }


    // Start chat

    function startChat() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const user =
        params.get("user") ||
        "Alex Morgan";

      window.location.href =
        "chat.html?user=" +
        encodeURIComponent(user);

    }


    // Voice call

    function voiceCall() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const user =
        params.get("user") ||
        "Alex Morgan";

      window.location.href =
        "call.html?type=voice&user=" +
        encodeURIComponent(user);

    }


    // Video call

    function videoCall() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const user =
        params.get("user") ||
        "Alex Morgan";

      window.location.href =
        "call.html?type=video&user=" +
        encodeURIComponent(user);

    }


    // Back

    function goBack() {

      window.location.href =
        "users.html";

    }


    // More menu

    function toggleMenu() {

      const menu =
        document.getElementById("moreMenu");

      if (menu.style.display === "block") {

        menu.style.display = "none";

      } else {

        menu.style.display = "block";

      }

    }


    // Share

    function shareProfile() {

      const url =
        window.location.href;

      if (navigator.share) {

        navigator.share({
          title: "Connectly Profile",
          text: "Check out this Connectly profile.",
          url: url
        });

      } else {

        navigator.clipboard.writeText(url);

        alert("Profile link copied!");

      }

    }


    // Mute

    function muteUser() {

      alert("User muted.");

      document.getElementById("moreMenu")
        .style.display = "none";

    }


    // Report

    function reportUser() {

      const confirmReport =
        confirm(
          "Do you want to report this user?"
        );

      if (confirmReport) {

        alert(
          "Report submitted. Thank you."
        );

      }

      document.getElementById("moreMenu")
        .style.display = "none";

    }


    // Block

    function blockUser() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const user =
        params.get("user") ||
        "this user";

      const confirmBlock =
        confirm(
          "Are you sure you want to block " +
          user +
          "?"
        );

      if (confirmBlock) {

        alert(
          user +
          " has been blocked."
        );

      }

    }


    // Load profile

    loadUser();

  </script>

</body>
</html>

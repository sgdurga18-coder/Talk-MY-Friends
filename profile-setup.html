<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set Up Profile - Talk MY Friends</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        radial-gradient(circle at top left, #263b8f, transparent 35%),
        radial-gradient(circle at bottom right, #671c91, transparent 35%),
        #07111f;
    }

    .box {
      width: 100%;
      max-width: 500px;

      padding: 35px;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.15);

      border-radius: 25px;

      backdrop-filter: blur(20px);

      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .logo span {
      color: #a855f7;
    }

    h1 {
      text-align: center;

      font-size: 27px;

      margin-top: 15px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #b8c0d4;

      font-size: 14px;

      margin-bottom: 28px;
    }

    .photo-section {
      text-align: center;

      margin-bottom: 25px;
    }

    .photo {
      width: 110px;
      height: 110px;

      border-radius: 50%;

      margin: auto;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(135deg, #6366f1, #a855f7);

      border: 4px solid rgba(255,255,255,0.15);

      font-size: 42px;
    }

    .photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .upload-btn {
      display: inline-block;

      margin-top: 12px;

      padding: 9px 16px;

      border-radius: 10px;

      background: rgba(168,85,247,0.15);

      border: 1px solid rgba(168,85,247,0.3);

      color: #d8b4fe;

      cursor: pointer;

      font-size: 13px;
    }

    #photoInput {
      display: none;
    }

    label {
      display: block;

      margin-top: 17px;

      margin-bottom: 7px;

      color: #dce3f5;

      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;

      padding: 14px 15px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.15);

      outline: none;

      background: rgba(0,0,0,0.22);

      color: white;

      font-size: 15px;

      font-family: Arial, sans-serif;
    }

    textarea {
      resize: vertical;

      min-height: 100px;
    }

    input:focus,
    textarea:focus {
      border-color: #8b5cf6;
    }

    .username-wrapper {
      position: relative;
    }

    .username-wrapper input {
      padding-left: 35px;
    }

    .at {
      position: absolute;

      left: 14px;

      top: 50%;

      transform: translateY(-50%);

      color: #a855f7;

      font-weight: bold;
    }

    .counter {
      text-align: right;

      margin-top: 5px;

      color: #7f8ba4;

      font-size: 12px;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: rgba(239,68,68,0.15);

      color: #fca5a5;
    }

    .message.success {
      display: block;

      background: rgba(34,197,94,0.15);

      color: #86efac;
    }

    .continue-btn {
      width: 100%;

      padding: 15px;

      margin-top: 22px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(135deg, #6366f1, #a855f7);

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .continue-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .skip {
      display: block;

      text-align: center;

      margin-top: 17px;

      color: #9aa5bb;

      text-decoration: none;

      font-size: 14px;
    }

    .user-email {
      text-align: center;

      margin-top: 10px;

      color: #8793ab;

      font-size: 12px;

      word-break: break-word;
    }

    @media (max-width: 500px) {

      .box {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .logo {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Talk MY <span>Friends</span>
    </div>

    <h1>Set Up Your Profile</h1>

    <p class="subtitle">
      Complete your profile so friends can find you.
    </p>


    <!-- Profile Photo -->

    <div class="photo-section">

      <div class="photo" id="photoPreview">
        👤
      </div>

      <label
        for="photoInput"
        class="upload-btn"
      >
        📷 Choose Profile Photo
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

    </div>


    <form id="profileForm">

      <!-- Full Name -->

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        maxlength="60"
        required
      >


      <!-- Username -->

      <label for="username">
        Username
      </label>

      <div class="username-wrapper">

        <span class="at">@</span>

        <input
          type="text"
          id="username"
          placeholder="username"
          maxlength="30"
          required
        >

      </div>


      <!-- Bio -->

      <label for="bio">
        Bio
      </label>

      <textarea
        id="bio"
        maxlength="120"
        placeholder="Tell people a little about yourself..."
      ></textarea>

      <div class="counter">
        <span id="bioCount">0</span>/120
      </div>


      <div
        class="user-email"
        id="userEmail"
      ></div>


      <!-- Message -->

      <div
        class="message"
        id="message"
      ></div>


      <!-- Save -->

      <button
        type="submit"
        class="continue-btn"
        id="saveBtn"
      >
        Continue to Talk MY Friends
      </button>

    </form>


    <a
      href="home.html"
      class="skip"
      id="skipBtn"
    >
      Skip for now
    </a>

  </div>


  <!-- =========================================
       FIREBASE PROFILE SETUP
  ========================================== -->

  <script type="module">

    import {
      auth,
      db
    } from "./firebase-config.js";


    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
      HTML elements
    */

    const form =
      document.getElementById("profileForm");

    const fullNameInput =
      document.getElementById("fullName");

    const usernameInput =
      document.getElementById("username");

    const bioInput =
      document.getElementById("bio");

    const bioCount =
      document.getElementById("bioCount");

    const photoInput =
      document.getElementById("photoInput");

    const photoPreview =
      document.getElementById("photoPreview");

    const saveBtn =
      document.getElementById("saveBtn");

    const skipBtn =
      document.getElementById("skipBtn");

    const message =
      document.getElementById("message");

    const userEmail =
      document.getElementById("userEmail");


    let currentUser = null;

    let selectedPhotoData = "";


    /*
      Show message
    */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /*
      Bio character counter
    */

    bioInput.addEventListener("input", () => {

      bioCount.textContent =
        bioInput.value.length;

    });


    /*
      Username formatting
    */

    usernameInput.addEventListener("input", () => {

      usernameInput.value =
        usernameInput.value
          .replace(/^@/, "")
          .replace(/[^a-zA-Z0-9_]/g, "")
          .toLowerCase();

    });


    /*
      Profile photo preview

      The photo is temporarily converted
      to a local data URL.

      Firebase Storage can be added later.
    */

    photoInput.addEventListener("change", () => {

      const file =
        photoInput.files[0];

      if (!file) {
        return;
      }


      if (!file.type.startsWith("image/")) {

        showMessage(
          "Please select an image file.",
          "error"
        );

        return;
      }


      if (file.size > 5 * 1024 * 1024) {

        showMessage(
          "Please choose an image smaller than 5 MB.",
          "error"
        );

        photoInput.value = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload = (event) => {

        selectedPhotoData =
          event.target.result;


        photoPreview.innerHTML =
          `<img src="${selectedPhotoData}" alt="Profile Photo">`;

      };


      reader.readAsDataURL(file);

    });


    /*
      Check Firebase Authentication
    */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        showMessage(
          "You are not logged in. Please login first.",
          "error"
        );

        saveBtn.disabled = true;

        return;
      }


      currentUser = user;


      userEmail.textContent =
        "Account: " + user.email;


      /*
        Load existing Firestore profile
        if available.
      */

      try {

        const userRef =
          doc(db, "users", user.uid);

        const userSnap =
          await getDoc(userRef);


        if (userSnap.exists()) {

          const data =
            userSnap.data();


          if (data.fullName) {

            fullNameInput.value =
              data.fullName;

          }


          if (data.username) {

            usernameInput.value =
              data.username;

          }


          if (data.bio) {

            bioInput.value =
              data.bio;

            bioCount.textContent =
              data.bio.length;

          }


          if (data.photoURL) {

            selectedPhotoData =
              data.photoURL;

            photoPreview.innerHTML =
              `<img src="${data.photoURL}" alt="Profile Photo">`;

          }

        }

      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }

    });


    /*
      Save Profile
    */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      if (!currentUser) {

        showMessage(
          "Please login before setting up your profile.",
          "error"
        );

        return;
      }


      const fullName =
        fullNameInput.value.trim();


      const username =
        usernameInput.value
          .trim()
          .replace(/^@/, "")
          .toLowerCase();


      const bio =
        bioInput.value.trim();


      /*
        Validation
      */

      if (fullName.length < 2) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {

        showMessage(
          "Username must be 3-30 characters and use only letters, numbers or underscore.",
          "error"
        );

        return;
      }


      if (bio.length > 120) {

        showMessage(
          "Bio cannot be longer than 120 characters.",
          "error"
        );

        return;
      }


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving Profile...";


      try {

        /*
          Save user profile in Firestore
        */

        await setDoc(
          doc(db, "users", currentUser.uid),
          {

            uid: currentUser.uid,

            fullName: fullName,

            username: username,

            usernameLower:
              username.toLowerCase(),

            email: currentUser.email,

            bio: bio,

            photoURL:
              selectedPhotoData || "",

            profileCompleted: true,

            updatedAt:
              serverTimestamp()

          },

          {
            merge: true
          }
        );


        /*
          Temporary local copy
        */

        localStorage.setItem(
          "talkMyFriendsProfile",
          JSON.stringify({

            uid: currentUser.uid,

            fullName: fullName,

            username: username,

            bio: bio,

            photoURL:
              selectedPhotoData || ""

          })
        );


        showMessage(
          "Profile saved successfully! 🎉",
          "success"
        );


        saveBtn.textContent =
          "Profile Saved";


        /*
          Go to Home
        */

        setTimeout(() => {

          window.location.href =
            "home.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Profile save error:",
          error
        );


        console.error(
          "Error code:",
          error.code
        );


        showMessage(
          "Could not save your profile. Please try again.",
          "error"
        );


        saveBtn.disabled = false;

        saveBtn.textContent =
          "Continue to Talk MY Friends";

      }

    });


    /*
      Skip button

      The account still exists in Firebase.
      The profile can be completed later.
    */

    skipBtn.addEventListener("click", (event) => {

      event.preventDefault();

      window.location.href =
        "home.html";

    });

  </script>

</body>
</html>
